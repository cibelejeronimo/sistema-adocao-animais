<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-green-700 p-4 shadow-md mb-10 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button id="btnLogout" onclick="logoutAdmin()" class="rounded-full border border-white/30 bg-white/10 px-3 py-1 text-sm font-semibold text-white hover:bg-white/20 transition disabled:opacity-50 disabled:cursor-not-allowed">Sair</button>
                <a href="index.html" class="text-xl font-bold flex items-center gap-2">🐾 Sistema Adoção</a>
            </div>
            <div class="space-x-6">
                <a href="admin-login.html" class="font-bold border-b-2 border-white pb-1">Login Admin</a>
                <a href="admin-register.html" class="hover:text-green-200 transition">Cadastrar Admin</a>
                <a href="painel-responsavel.html" class="hover:text-green-200 transition">Painel ADM</a>
            </div>
        </div>
    </nav>

    <div class="flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-green-600">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Login do Administrador</h2>
            <form id="formLogin" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" placeholder="admin@exemplo.com" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="senha" placeholder="Senha" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" required>
                </div>

                
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold p-3 w-full rounded-lg shadow-md transition-colors">
                    Entrar
                </button>
            </form>
            <p id="mensagem" class="mt-4 text-center font-bold"></p>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();
                const msgElement = document.getElementById('mensagem');

                if (response.ok) {
                    localStorage.setItem('adminToken', resultado.token);
                    msgElement.classList.remove('text-red-600');
                    msgElement.classList.add('text-green-700');
                    msgElement.innerText = 'Login realizado com sucesso! Redirecionando...';
                    setTimeout(() => window.location.href = 'painel-responsavel.html', 1200);
                } else {
                    msgElement.classList.remove('text-green-700');
                    msgElement.classList.add('text-red-600');
                    msgElement.innerText = resultado.erro || 'Erro ao realizar login.';
                }
            } catch (error) {
                console.error(error);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const btnLogout = document.getElementById('btnLogout');
            if (btnLogout) {
                const isAdmin = !!localStorage.getItem('adminToken');
                btnLogout.disabled = !isAdmin;
                btnLogout.classList.toggle('opacity-50', !isAdmin);
                btnLogout.classList.toggle('cursor-not-allowed', !isAdmin);
            }
        });

        function logoutAdmin() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('admin');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
