<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Adotante - Sistema Adoção</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-green-700 p-4 shadow-md mb-10 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button id="btnLogout" onclick="logoutAdmin()" class="rounded-full border border-white/30 bg-white/10 px-3 py-1 text-sm font-semibold text-white hover:bg-white/20 transition disabled:opacity-50 disabled:cursor-not-allowed">Sair</button>
                <a href="index.html" class="text-xl font-bold flex items-center gap-2">🐾 Sistema Adoção</a>
            </div>
            <div class="space-x-6">
                <a href="index.html" class="hover:text-green-200 transition">Home (Vitrine)</a>
                <a href="cadastro.html" class="font-bold border-b-2 border-white pb-1">Cadastrar Adotante</a>
                <a href="admin.html" class="hover:text-green-200 transition show-for-admin"> Cadastrar Animal</a>
                <div class="relative inline-block group">
                    <a href="painel-responsavel.html" class="hover:text-green-200 border-l pl-4 border-green-500">Painel ADM ▾</a>
                    <div class="absolute right-0 mt-2 hidden group-hover:block bg-white text-gray-800 rounded shadow-lg min-w-[200px]">
                        <a href="painel-responsavel.html" class="block px-4 py-2 hover:bg-gray-100">Entrar Painel</a>
                        <a href="admin-register.html" class="block px-4 py-2 hover:bg-gray-100 show-for-admin">Cadastrar Administrador</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <script>
        (function(){
            const isAdmin = !!localStorage.getItem('adminToken');
            document.querySelectorAll('.show-for-admin').forEach(el => el.style.display = isAdmin ? '' : 'none');
            const path = window.location.pathname.split('/').pop();
            const btnLogout = document.getElementById('btnLogout');
            if (btnLogout) {
                btnLogout.disabled = !isAdmin;
                btnLogout.classList.toggle('opacity-50', !isAdmin);
                btnLogout.classList.toggle('cursor-not-allowed', !isAdmin);
            }
            if ((path === 'admin.html' || path === 'painel-responsavel.html') && !isAdmin) {

            }
        })();
        function logoutAdmin() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('admin');
            window.location.href = 'admin-login.html';
        }
    </script>

    <div class="flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-green-600">
            <h2 class="text-2xl font-bold mb-2 text-gray-800">Seja um Adotante</h2>
            <p class="text-gray-600 mb-6 text-sm">Preencha seus dados para iniciar um processo de adoção.</p>
            
            <form id="formCadastro" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" required>
                </div>
                 <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data de Nascimento</label>
                    <input type="text" id="dataNascimento" placeholder="00/00/0000" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                    <input type="text" id="telefone" placeholder="(00) 00000-0000" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Endereço</label>
                    <input type="text" id="endereco" placeholder="Rua, Bairro" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Número da casa</label>
                    <input type="text" id="numero" placeholder="Número da casa" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
                    <input type="text" id="cidade" placeholder="Cidade" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">UF</label>
                    <input type="text" id="uf" placeholder="UF" class="border border-gray-300 p-2.5 w-full rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold p-3 w-full rounded-lg shadow-md transition-colors mt-4">
                    Gravar Cadastro
                </button>
            </form>
            
            <p id="mensagem" class="mt-4 text-center font-bold text-green-700"></p>
        </div>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                telefone: document.getElementById('telefone').value,
                endereco: document.getElementById('endereco').value,
                numero: document.getElementById('numero').value,
                cidade: document.getElementById('cidade').value,
                uf: document.getElementById('uf').value
            };

            try {
                const response = await fetch('/adotantes/cadastrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();
                const msgElement = document.getElementById('mensagem');
                
                msgElement.innerText = resultado.mensagem || resultado.erro;
                
                if(response.ok) {
                    document.getElementById('formCadastro').reset();
                    msgElement.classList.remove('text-red-600');
                    msgElement.classList.add('text-green-700');
                } else {
                    msgElement.classList.remove('text-green-700');
                    msgElement.classList.add('text-red-600');
                }
            } catch (err) {
                console.error("Erro ao cadastrar:", err);
            }
        });
    </script>
</body>
</html>
