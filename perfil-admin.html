<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil ADM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-green-700 p-4 shadow-md text-white">
        <div class="container mx-auto flex justify-between items-center">
            <span class="text-xl font-bold">🐾 Painel ADM</span>
            <div class="space-x-6 flex items-center">
                <a href="painel-responsavel.html" class="hover:text-green-200 transition">Voltar ao Painel</a>
                <button onclick="sairAdmin()" class="bg-red-600 px-4 py-1 rounded hover:bg-red-700">Deslogar Conta</button>
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-10 px-4 max-w-lg text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">Administrador do Sistema</h2>
        <p class="text-gray-600 mb-6">Você está logado com privilégios de gestor.</p>
        <button onclick="sairAdmin()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full shadow-lg">Sair do Sistema</button>
    </div>
    <script>
        if (!localStorage.getItem('adminToken')) window.location.href = 'login.html';
        function sairAdmin() {
            localStorage.removeItem('adminToken');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
