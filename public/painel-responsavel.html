<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM - Gestão de Adoções</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-green-700 p-4 shadow-md mb-6 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold flex items-center gap-2">🐾 Sistema Adoção</a>
            <div class="space-x-6">
                <a href="index.html" class="hover:text-green-200 transition">Home (Vitrine)</a>
                <a href="cadastro.html" class="hover:text-green-200 transition">Cadastrar Adotante</a>
                <a href="admin.html" class="hover:text-green-200 transition">Divulgar Animal</a>
                <a href="painel-responsavel.html" class="font-bold border-l pl-4 border-green-500 text-green-200">Painel ADM</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Solicitações de Adoção</h1>
            <p class="text-gray-600">Analise os pedidos e decida o futuro dos pequenos</p>
            <div class="w-24 h-1 bg-green-500 mx-auto mt-4 rounded-full"></div>
        </div>
        
        <div id="listaPedidos" class="max-w-4xl mx-auto space-y-4">
        </div>

        <div class="text-center mt-16 mb-8">
            <h2 class="text-3xl font-bold text-gray-800">Adotantes Cadastrados</h2>
            <p class="text-gray-600">Gerencie o status dos adotantes e ative quem estiver pronto.</p>
            <div class="w-24 h-1 bg-green-500 mx-auto mt-4 rounded-full"></div>
        </div>

        <div id="listaAdotantes" class="max-w-4xl mx-auto space-y-4 mb-10">
        </div>
    </div>

    <script>
        async function carregarPedidos() {
            try {
                const response = await fetch('/adocoes/listar');
                const pedidos = await response.json();
                const container = document.getElementById('listaPedidos');

                if (pedidos.length === 0) {
                    container.innerHTML = `
                        <div class="text-center p-10 bg-white rounded-lg shadow">
                            <p class="text-gray-500">Não há solicitações pendentes no momento. ✨</p>
                        </div>`;
                    return;
                }

                container.innerHTML = pedidos.map(p => `
                    <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center border-l-8 border-green-600">
                        <div>
                            <p class="text-sm text-gray-500 uppercase font-bold text-xs">Candidato a Adotante:</p>
                            <p class="text-xl font-bold text-gray-800">${p.Adotante.nome}</p>
                            <p class="text-gray-600">📍 ${p.Adotante.endereco}</p>
                            <div class="mt-3 inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-bold">
                                🐶 Animal: ${p.Animal.nome}
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="decidir(${p.id_adocao}, 'finalizado')" 
                                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold shadow transition">
                                Aprovar
                            </button>
                            <button onclick="decidir(${p.id_adocao}, 'reprovado')" 
                                    class="bg-red-50 hover:bg-red-100 text-red-700 px-6 py-2 rounded-lg font-bold border border-red-200 transition">
                                Reprovar
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Erro ao carregar pedidos:", error);
            }
        }

        async function decidir(id, status) {
            const acao = status === 'finalizado' ? 'APROVAR' : 'REPROVAR';
            const confirmar = confirm(`Deseja realmente ${acao} este pedido de adoção?`);
            
            if (confirmar) {
                const response = await fetch(`/adocoes/decidir/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    alert('✅ Status atualizado com sucesso!');
                    carregarPedidos(); 
                } else {
                    alert('❌ Erro ao atualizar status.');
                }
            }
        }

        async function carregarAdotantes() {
            try {
                const response = await fetch('/adotantes/listar');
                const adotantes = await response.json();
                const container = document.getElementById('listaAdotantes');

                if (adotantes.length === 0) {
                    container.innerHTML = `
                        <div class="text-center p-10 bg-white rounded-lg shadow">
                            <p class="text-gray-500">Nenhum adotante cadastrado ainda.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = adotantes.map(a => `
                    <div class="bg-white p-6 rounded-lg shadow-md flex flex-col md:flex-row md:justify-between md:items-center border border-gray-200">
                        <div>
                            <p class="text-sm text-gray-500 uppercase font-bold text-xs">Adotante:</p>
                            <p class="text-xl font-bold text-gray-800">${a.nome}</p>
                            <p class="text-gray-600">📍 ${a.endereco || 'Não informado'}</p>
                            <p class="text-gray-600">📞 ${a.telefone || 'Sem telefone'}</p>
                        </div>
                        <div class="mt-4 md:mt-0 flex flex-col gap-3 items-start md:items-end">
                            <span class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-sm font-semibold ${a.situacao === 'Ativo' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${a.situacao}
                            </span>
                            <div class="flex gap-2">
                                <button onclick="alterarStatusAdotante(${a.id_adotante}, 'Ativo')" class="px-4 py-2 rounded-lg font-bold text-white ${a.situacao === 'Ativo' ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700'}" ${a.situacao === 'Ativo' ? 'disabled' : ''}>
                                    Ativar
                                </button>
                                <button onclick="alterarStatusAdotante(${a.id_adotante}, 'Inativo')" class="px-4 py-2 rounded-lg font-bold text-white ${a.situacao === 'Inativo' ? 'bg-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700'}" ${a.situacao === 'Inativo' ? 'disabled' : ''}>
                                    Inativar
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar adotantes:', error);
            }
        }

        async function alterarStatusAdotante(id, situacao) {
            const confirmar = confirm(`Deseja alterar o status do adotante para ${situacao}?`);
            if (!confirmar) return;

            const response = await fetch(`/adotantes/status/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ situacao })
            });

            if (response.ok) {
                alert('✅ Status atualizado com sucesso!');
                carregarAdotantes();
            } else {
                const erro = await response.json();
                alert(`❌ ${erro.erro || 'Erro ao atualizar status.'}`);
            }
        }

        // Inicia a carga de dados ao abrir a página
        carregarPedidos();
        carregarAdotantes();
    </script>
</body>
</html>
